# ============================================================================
# JobHunter 配置文件
# ----------------------------------------------------------------------------
# 这个文件是「我个人的求职偏好」，会被提交进仓库（不含任何隐私信息）。
# 真正的密钥只放 .env（已在 .gitignore 里排除）。
#
# 优先级：环境变量（JH_*） > .env > 本文件 > 代码默认值
# 字段释义详见 docs/config.md（P9 补全）。
# ============================================================================

# ---- 搜索/筛选口径（将来给可选适配器用的"意图"，不是自动搜索的开关）--------
keywords:
  - AI Agent
  - 大模型应用
  - Python 开发
  - 前端开发

cities:
  - 深圳
  - 广州
  - 东莞

# intern（实习）/ fulltime（全职）/ both（都要）
job_type: both

# ---- 打分与额度 -------------------------------------------------------------
# 匹配分低于这个值就不进待投清单
threshold: 60
# 每天最多推几条（防止海投上瘾 + 保护账号）
daily_limit: 20
# 只有规则分排前 N 的岗位才走 LLM 精评（省钱、提速）
llm_top_n: 30

# 三维度权重，必须加起来 = 100（配置校验会强制检查）
# 调权重的方法：跑 `jh match explain <job_id>` 看分维度明细，再回来改这里。
match_weights:
  direction: 30   # 岗位方向（AI/算法/大模型 vs 前端/后端）
  hard: 30        # 硬条件（经验年限 / 是否应届 / 城市 / 学历）
  skill: 40       # 技能关键词交集

match_dimensions:
  - 技能关键词
  - 岗位方向
  - 经验年限/是否应届

# ---- 技能归一化词表 ---------------------------------------------------------
# 解决"同一个技能多种写法"以及"短词误命中"的问题。
# 归一化的目标名 -> 所有等价写法（含中英文）
# 为什么必须做：中文没有词边界，`Java` 会命中 `JavaScript`、`Go` 会命中 `Google`。
# 英文别名匹配时统一加 `\b` 词边界，所以这里只要列全写法即可。
skill_aliases:
  LLM:
    - 大模型
    - 大语言模型
    - 大模型应用
    - LLM
    - large language model
  RAG:
    - RAG
    - 检索增强
    - 检索增强生成
  Python:
    - Python
    - python3
  JavaScript:
    - JavaScript
    - JS
    - ECMAScript
  TypeScript:
    - TypeScript
    - TS
  Vue:
    - Vue
    - Vue.js
    - Vue3
  React:
    - React
    - React.js
  Docker:
    - Docker
    - 容器化
  Kubernetes:
    - Kubernetes
    - K8s
  MySQL:
    - MySQL
  Redis:
    - Redis

# ---- "我在学"白名单 ---------------------------------------------------------
# 红线修正：如果某个技能"刚做了 demo 但还不够熟"，完全不许提反而失真。
# 放进这个白名单后，允许引用，但必须标注"在学习中"。
learning_whitelist:
  - LangChain
  - Kubernetes

# ---- 开场白生成 -------------------------------------------------------------
# 禁用套话（LLM 特别爱写这些，会被 HR 一眼看出是群发）
greeting_banned_words:
  - 贵司
  - 期待
  - 三生有幸
  - 百忙之中
  - 万分感谢
  - 希望能有机会
  - 感谢您的阅读
  - 冒昧打扰

greeting:
  full_min_chars: 80    # 完整版下限
  full_max_chars: 150   # 完整版上限
  short_max_chars: 60   # 精简版上限（应对 BOSS 字数限制）
  github_url: ""        # 我的 GitHub（优势项，会附在开场白里）

# ---- 定制简历（P5）----------------------------------------------------------
# 这里的每个数字都会**同时**进两处：提示词里的约束（劝模型守规矩）
# 与 FidelityGuard 的判定（代码强制）。改小 = 更严格，只会拦得更多，不会放水。
tailor:
  # 改写后的长度上限 = 原文 × 这个比例（"改写不是扩写"）
  max_length_ratio: 1.5
  # 绝对余量：原句很短时（"参与重构"），1.5 倍也只有 6 个字，
  # 任何通顺的改写都会超 —— 那是纯误报，所以再给 30 个字的余量。
  length_floor_extra: 30
  # 一次最多给多少条建议（超过这个数我就没耐心逐条审，而逐条审核是安全边界）
  max_suggestions: 12
  # `jh tailor brief` 里"重点讲几个项目 / 突出几个技能"
  brief_projects: 3
  brief_skills: 2

# ---- 频率克制 ---------------------------------------------------------------
# 合规红线：随机延时 + 翻页上限 + --dry-run + 出错即停
rate_limit:
  min_delay_seconds: 2.0
  max_delay_seconds: 5.0
  max_pages: 3

# ---- CLI 行为 ---------------------------------------------------------------
# 顶部"待处理提醒"是否显示（可在单次命令用 --no-remind 关掉）
show_reminders: true
