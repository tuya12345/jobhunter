# ============================================================================
# 方向画像（用于 `jh resume split` 的拆分建议）
# ----------------------------------------------------------------------------
# 一句话解释这个文件的作用：
#   把"某个方向看重什么"变成**数据**，而不是散落在代码里的 if-else。
#   你想加一个方向（比如"测试开发"）、想调某个方向的权重，只改这个文件，不动代码。
#
# 每个方向包含：
#   label       显示名（也是简历 direction 字段建议填的值）
#   aliases     我在 config.yaml 的 keywords 里可能写的同义说法（做匹配归并用）
#   core_skills 这个方向**必须**有的技能（简历没有 → 进 gaps）
#   plus_skills 加分项技能
#   weak_skills 与这个方向**关系不大**的技能 → split 时建议弱化
#   title_hints 岗位标题常见词（P3 判断岗位方向时会复用同一份词表，保持口径一致）
#   priority_keywords
#               项目/经历的排序偏好词：出现的越靠前，越该在简历里前置
#
# 调参建议：先跑 `jh resume split <id>` 看建议是否合理，不合理就回来改这里的词表。
# ============================================================================

directions:
  ai_agent:
    label: "AI Agent"
    aliases: ["AI Agent", "AI应用", "智能体", "Agent", "AI 应用"]
    core_skills:
