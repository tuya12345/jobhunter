# ============================================================================
# JobHunter CI —— ubuntu + windows 双平台矩阵
# ----------------------------------------------------------------------------
# 为什么必须跑 Windows（评审采纳项）：
#   本项目的主战场就是 Windows（BOSS 网页版 + 后面可能的模拟器）。
#   只跑 Ubuntu 是"虚假安全感"——下面这些坑全是 Windows 特有的：
#     · 裸 open() 默认 cp936，读写中文简历直接崩（这就是 ruff PLW1514 要守住的东西）
#     · 路径分隔符 / 盘符
#     · asyncio 事件循环策略差异（P3 的并发 LLM 精评会遇到）
#
# 默认只跑确定性测试：pyproject 里 addopts 已带 -m 'not live and not emulator'，
# 所以 CI 不依赖网络、不依赖模拟器 → 不会三天两头红灯。
#
# P9 加了什么：pytest 带覆盖率（`--cov-fail-under=80`，当前 84%）并把 coverage.xml
# 作为产物上传。门槛刻意留有余量、且不追高 —— 理由写在那个 step 的注释里。
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 会取消上一次还在跑的 job，省 CI 额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # 一个平台挂了，另一个平台的结果照样要看到
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 校验锁文件与 pyproject 一致
        # 如果有人改了依赖却忘了提交 uv.lock，这里会红 —— 防止"我这儿能跑"
        run: uv lock --check

      - name: 安装依赖（含 dev 组与 docx / web extra）
        # ★ `--extra docx` 不能省（ISSUES #16，实测踩到）：
        #   `tests/unit/test_docx_reader.py`、`test_resume_svc.py`、`test_resume_cli.py`
        #   顶部都是 `pytest.importorskip("docx")` —— 不装这个 extra 时
        #   **73 条简历解析测试会被整体静默跳过**，而 CI 依然显示绿。
        #   那等于"CI 在 Windows 上真验证简历解析"这件事从来没有发生过。
        # ★ `--extra web`（P7，ISSUE #59）：`tests/unit/test_leads_api.py` 用 FastAPI 的
        #   TestClient 测接口。不装的话那一整个文件会被 importorskip 跳过 ——
        #   又是"CI 绿着、但其实没测"的同一种坑。
        #   （其余 extra 不用装：browser/emulator 的测试带 marker，默认排除。）
        run: uv sync --locked --python ${{ matrix.python-version }} --extra docx --extra web

      - name: ruff 检查（默认规则集）
        run: uv run ruff check .

      - name: ruff 编码守卫（PLW1514：裸 open 必须显式 encoding）
        # ★ 为什么它是**单独一条**命令（ISSUE #7）：
        #   PLW1514 是 ruff 的 preview 规则，不开 `--preview` 就完全不会生效
        #   （只在 select 里列出来，ruff 只会给一句 "has no effect" 的提示）。
        #   而全局打开 preview 会一次性引入 9 条与本项目无关的 preview 规则（实测 65 处），
        #   且 preview 规则本身不稳定 → CI 会为"与本次改动无关的原因"变红。
        #   所以这里按规则精确开；完整取舍写在 pyproject.toml 的 [tool.ruff.lint] 上方。
        #   ⚠️ 这条步骤不能被删：tests/unit/test_encoding_lint_guard.py 会断言它还在。
        run: uv run ruff check --preview --select PLW1514 src/ tests/

      - name: ruff 格式检查（本地和 CI 用同一套格式规则）
        # 不自动改文件，只检查 —— CI 只负责发现问题，"格式化"是开发者本地的事
        run: uv run ruff format --check .

      - name: 确认 CLI 入口可用
        run: uv run jh --help

      - name: pytest（默认排除 live / emulator）+ 覆盖率门槛
        # ★ 覆盖率闸门（P9 加）：当前 **84%**，门槛设 80% —— 留一点余量给正常改动，
        #   但真出现"整块功能没人测"时会红。
        #   ⚠️ 刻意**不设 90/95** 这种高门槛：追覆盖率会催生"为覆盖率而写"的测试，
        #      那种测试不验证行为、只在改实现时制造阻力（本项目已经有 800+ 条真断言）。
        #   `--cov-report=term-missing` 会把没覆盖到的行号打出来，比一个数字有用得多。
        run: >-
          uv run pytest
          --cov=jobhunter --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

      - name: 上传覆盖率报告（失败也传，方便查为什么掉下来）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: 隐私扫描（受跟踪的文件里不许有真实身份标识）
        # 依据：ISSUES #54 —— 把"仓库里没有真实姓名/学校/手机号"从"靠人记得跑"
        # 变成 CI 保证，并且**扫描样本本身不进仓库**。
        #   · 样本来源：repository secret `JH_PII_SAMPLES`（逗号分隔），
        #     或本机 `state/pii-samples.txt`（`state/` 已 gitignore）。
        #   · **没配样本时用例会 skip**（不是 pass）—— `-rs` 让它出现在摘要里，
        #     所以"没扫"这件事永远看得见，不会伪装成"扫过了没问题"。
        #   · 报的是命中**位置**，不回显命中内容（内容本身就是隐私）。
        # ★★ 为什么指向 tests/unit/ 而不是 tests/verify/test_v_p9.py（只读审查 JH-01）：
        #   后者是**验证会话**的文件，且当时**没有被 git 跟踪** —— 干净 checkout 里
        #   这个路径不存在，CI 会因为"测试文件缺失"直接失败（远端红、本地绿）。
        #   现在这条指向受跟踪的 `tests/unit/test_repo_pii_scan.py`；同一文件里的
        #   `test_ci_step_references_a_tracked_privacy_test` 会**扫这个 workflow**，
        #   保证这条步骤将来也不会再指到一个仓库里不存在的测试。
        #   （验证会话那份一旦提交进仓库，可以再补一条 step 一起跑。）
        env:
          JH_PII_SAMPLES: ${{ secrets.JH_PII_SAMPLES }}
        run: >-
          uv run pytest
          tests/unit/test_repo_pii_scan.py
          -rs -v

      - name: 报告 SQLite 版本（排查"外键/WAL 行为差异"时有用）
        # SQLite 版本会影响 PRAGMA 与 batch 迁移行为，出问题时第一个要看的就是它
        run: uv run python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

  frontend:
    name: 前端构建（web/）
    # ★ 为什么单开一个 job、而不是塞进上面的矩阵（P7 / ISSUE #59）：
    #   · 上面那个 job 在 ubuntu + windows 各跑一遍，Node 步骤塞进去会跑两次，
    #     而前端构建与操作系统无关（它就是 tsc + vite）；
    #   · 前端失败与后端失败是**两件事**，分开显示更容易看出该去修哪边。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # ★ 24：`npm test` 用 `node --test` 直接跑 `.ts`
          #   （Node 的原生类型擦除，需要 ≥ 22.18）。钉大版本、不钉小版本，
          #   与"前端零测试框架依赖"这个取舍配套。
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 装依赖（严格按锁文件）
        working-directory: web
        run: npm ci

      - name: 纯函数测试（三态可达性 / 投递反馈）
        # 不引 vitest/jest：两条最容易做错的逻辑（可达性三态、投递结果文案）
        # 被抽成纯函数，`node --test` 就能跑 —— 零新依赖换来"这两条真有测试"。
        working-directory: web
        run: npm test

      - name: 构建（tsc --noEmit + vite build）
        working-directory: web
        run: npm run build

      - name: 构建产物不进仓库
        # 与 `.gitignore` 里的 `web/dist/` 配套：**源码进仓库、产物不进**。
        # 这条断言是"规则真的生效"的证据（只看 .gitignore 不够 ——
        # 有人 `git add -f` 就绕过去了）。
        run: |
          if [ -n "$(git ls-files web/dist)" ]; then
            echo "web/dist 里有被跟踪的文件，构建产物不该进仓库："
            git ls-files web/dist
            exit 1
          fi
          echo "web/dist 未被跟踪 ✓"
