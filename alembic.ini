# ============================================================================
# Alembic configuration for JobHunter
# ----------------------------------------------------------------------------
# NOTE: this file is intentionally pure ASCII.
#   Alembic's compat layer reads alembic.ini with `encoding="locale"`
#   (configparser read(..., encoding="locale")), which on a Chinese Windows
#   resolves to cp936 -- so non-ASCII comments here crash with UnicodeDecodeError
#   before any migration runs. Keep this file ASCII-only.
#
# NOTE: sqlalchemy.url is deliberately NOT set here.
#   Setting it would commit a machine-specific absolute path into the repo.
#   The URL is injected at runtime by storage/migrate.py.
#
# Manual usage (normally you just run `jh init` instead):
#   uv run alembic upgrade head
# ============================================================================
[alembic]
script_location = alembic

# Revision files get a readable name: 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

# created_date in generated files uses local time (business timestamps in the
# database are UTC; do not confuse the two)
timezone = Asia/Shanghai

# Make `import jobhunter` work without an editable install.
# path_separator=os is required by newer Alembic: without it, prepend_sys_path falls
# back to legacy splitting on spaces/commas/colons and emits a DeprecationWarning.
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
